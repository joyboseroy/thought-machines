[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thought-machines"
version = "0.2.0"
description = "An executable atlas of mathematical theories of cognition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
thought-machines = "thought_machines.cli:main"

[tool.setuptools.packages.find]
include = ["thought_machines*"]
